<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Kelola Kategori - Mie Gacoan</title>
  <link rel="stylesheet" href="../css/main.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="dashboard-container">

  <!-- Header Navigation -->
  <header class="app-header dark-header" style="padding: 14px 24px; background: #0f172a; border-bottom: 1px solid #1e293b; display: flex; justify-content: space-between; align-items: center;">
    <div class="brand-logo" style="display: flex; align-items: center; gap: 10px;">
      <span class="brand-badge" style="background: linear-gradient(135deg, var(--accent-purple), #7b1fa2); color: white; padding: 4px 12px; border-radius: var(--radius-sm); font-weight: 800; font-size: 0.75rem;">ADMIN</span>
      <span style="font-weight: 900; font-family: var(--font-heading); color: white; font-size: 1.15rem;">Kelola Kategori Menu</span>
    </div>
    <a href="dashboard.html" class="btn btn-dark" style="width: auto; padding: 8px 16px; font-size: 0.8rem; background: #1e293b; color: white; border: 1px solid #334155;"><i data-lucide="arrow-left"></i> Dashboard</a>
  </header>

  <!-- Sub Navigation Bar -->
  <div style="background: #1e293b; padding: 12px 24px; border-bottom: 1px solid #334155; display: flex; gap: 20px; overflow-x: auto; align-items: center;">
    <a href="dashboard.html" style="color: #94a3b8; font-weight: 600; font-size: 0.9rem; text-decoration: none; whitespace: nowrap;"><i data-lucide="bar-chart-3"></i> Dashboard</a>
    <a href="products.html" style="color: #94a3b8; font-weight: 600; font-size: 0.9rem; text-decoration: none; whitespace: nowrap;"><i data-lucide="utensils"></i> Produk Menu</a>
    <a href="categories.html" style="color: var(--primary-pink); font-weight: 700; font-size: 0.9rem; text-decoration: none; border-bottom: 2px solid var(--primary-pink); padding-bottom: 4px; whitespace: nowrap;"><i data-lucide="folder"></i> Kategori</a>
    <a href="inventory.html" style="color: #94a3b8; font-weight: 600; font-size: 0.9rem; text-decoration: none; whitespace: nowrap;"><i data-lucide="package"></i> Stok Inventory</a>
    <a href="promotions.html" style="color: #94a3b8; font-weight: 600; font-size: 0.9rem; text-decoration: none; whitespace: nowrap;"><i data-lucide="ticket"></i> Promo</a>
    <a href="orders.html" style="color: #94a3b8; font-weight: 600; font-size: 0.9rem; text-decoration: none; whitespace: nowrap;"><i data-lucide="receipt"></i> Transaksi</a>
    <a href="reservations.html" style="color: #94a3b8; font-weight: 600; font-size: 0.9rem; text-decoration: none; whitespace: nowrap;"><i data-lucide="calendar"></i> Reservasi</a>
    <a href="users.html" style="color: #94a3b8; font-weight: 600; font-size: 0.9rem; text-decoration: none; whitespace: nowrap;"><i data-lucide="users"></i> Pengguna & Staff</a>
    <a href="reports.html" style="color: #94a3b8; font-weight: 600; font-size: 0.9rem; text-decoration: none; whitespace: nowrap;"><i data-lucide="line-chart"></i> Laporan</a>
    <a href="settings.html" style="color: #94a3b8; font-weight: 600; font-size: 0.9rem; text-decoration: none; whitespace: nowrap;"><i data-lucide="settings"></i> Pengaturan</a>
    <a href="audit-logs.html" style="color: #94a3b8; font-weight: 600; font-size: 0.9rem; text-decoration: none; whitespace: nowrap;"><i data-lucide="shield-check"></i> Audit Logs</a>
  </div>

  <main style="padding: 24px; display: flex; flex-direction: column; gap: 20px; max-width: 1400px; margin: 0 auto; width: 100%;">
    
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h2 style="font-size: 1.25rem; font-weight: 800; color: white;"><i data-lucide="folder"></i> Master Kategori Produk</h2>
      <button onclick="openAddCatModal()" class="btn btn-primary" style="width: auto; padding: 10px 18px; font-size: 0.85rem; font-weight: 700;">
        <i data-lucide="plus"></i> Tambah Kategori
      </button>
    </div>

    <!-- Data Table -->
    <div class="card card-dark" style="background: #1e293b; border-radius: var(--radius-lg); padding: 20px;">
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>Urutan</th>
              <th>Nama Kategori</th>
              <th>Slug</th>
              <th>Status</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="catTableBody">
            <!-- JS Rendered -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- Add / Edit Modal -->
  <div id="catModal" class="modal-backdrop" onclick="closeCatModal()">
    <div class="modal-sheet" style="background: #1e293b; color: white;" onclick="event.stopPropagation()">
      <div class="modal-drag-handle"></div>
      <h3 id="catModalTitle" style="font-size: 1.1rem; font-weight: 800; margin-bottom: 16px;">Tambah Kategori</h3>

      <form id="catForm" style="display: flex; flex-direction: column; gap: 12px;">
        <input type="hidden" id="catId" />
        <div>
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px;">Nama Kategori *</label>
          <input type="text" id="catName" required class="card card-dark" style="width: 100%; padding: 10px;" />
        </div>
        <div>
          <label style="display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px;">Urutan Tampilan *</label>
          <input type="number" id="catOrder" required value="1" class="card card-dark" style="width: 100%; padding: 10px;" />
        </div>
        <button type="submit" class="btn btn-primary" style="margin-top: 10px;">Simpan Kategori</button>
      </form>
    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await AuthModule.requireRole(["ADMIN"]);
      await loadCategories();
    });

    async function loadCategories() {
      const sb = getSupabase();
      const tbody = document.getElementById("catTableBody");
      const { data: list } = await sb.from("categories").select("*").order("display_order");

      if (!list) return;

      tbody.innerHTML = list.map(c => `
        <tr>
          <td style="font-weight: 800; color: var(--primary-pink);">${c.display_order}</td>
          <td style="font-weight: 700; color: white;">${c.name}</td>
          <td style="font-family: monospace; color: #94a3b8;">${c.slug}</td>
          <td><span class="badge ${c.is_active ? 'badge-paid' : 'badge-cancelled'}">${c.is_active ? 'Aktif' : 'Nonaktif'}</span></td>
          <td>
            <button onclick="toggleCatActive('${c.id}', ${!c.is_active})" class="btn btn-secondary" style="width: auto; padding: 4px 8px; font-size: 0.75rem;">${c.is_active ? 'Nonaktifkan' : 'Aktifkan'}</button>
          </td>
        </tr>
      `).join("");
    }

    function openAddCatModal() {
      document.getElementById("catModalTitle").innerText = "Tambah Kategori Baru";
      document.getElementById("catId").value = "";
      document.getElementById("catName").value = "";
      document.getElementById("catOrder").value = "1";
      Utils.openModal("catModal");
    }

    function closeCatModal() {
      Utils.closeModal("catModal");
    }

    document.getElementById("catForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const sb = getSupabase();
      const name = document.getElementById("catName").value.trim();
      const display_order = parseInt(document.getElementById("catOrder").value);
      const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, "-");

      await sb.from("categories").insert({ name, slug, display_order, is_active: true });
      Utils.showToast("Kategori disimpan", "success");
      closeCatModal();
      loadCategories();
    });

    async function toggleCatActive(id, val) {
      const sb = getSupabase();
      await sb.from("categories").update({ is_active: val }).eq("id", id);
      loadCategories();
    }
  </script>
</body>
</html>
