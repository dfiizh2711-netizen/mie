<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Audit Logs - Mie Gacoan</title>
  <link rel="stylesheet" href="../css/main.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dashboard-container">

  <!-- Header Navigation -->
  <header class="app-header dark-header" style="padding: 14px 24px;">
    <div class="brand-logo">
      <span class="brand-badge" style="background: linear-gradient(135deg, var(--accent-purple), #7b1fa2);">ADMIN</span>
      <span>Audit Logs Log Aktivitas Sistem</span>
    </div>
    <a href="dashboard.html" class="btn btn-dark" style="width: auto; padding: 6px 14px; font-size: 0.8rem;">← Dashboard</a>
  </header>

  <!-- Sub Navigation Bar -->
  <div style="background: #1e293b; padding: 10px 24px; border-bottom: 1px solid #334155; display: flex; gap: 16px; overflow-x: auto;">
    <a href="dashboard.html" style="color: #94a3b8; font-weight: 600; font-size: 0.9rem;">📊 Dashboard</a>
    <a href="products.html" style="color: #94a3b8; font-weight: 600; font-size: 0.9rem;">🍜 Produk Menu</a>
    <a href="categories.html" style="color: #94a3b8; font-weight: 600; font-size: 0.9rem;">📂 Kategori</a>
    <a href="inventory.html" style="color: #94a3b8; font-weight: 600; font-size: 0.9rem;">📦 Stok Inventory</a>
    <a href="promotions.html" style="color: #94a3b8; font-weight: 600; font-size: 0.9rem;">🎟️ Promo</a>
    <a href="orders.html" style="color: #94a3b8; font-weight: 600; font-size: 0.9rem;">📜 Transaksi</a>
    <a href="users.html" style="color: #94a3b8; font-weight: 600; font-size: 0.9rem;">👥 Pengguna & Staff</a>
    <a href="reports.html" style="color: #94a3b8; font-weight: 600; font-size: 0.9rem;">📈 Laporan</a>
    <a href="settings.html" style="color: #94a3b8; font-weight: 600; font-size: 0.9rem;">⚙️ Pengaturan</a>
    <a href="audit-logs.html" style="color: var(--primary-pink); font-weight: 700; font-size: 0.9rem;">🛡️ Audit Logs</a>
  </div>

  <main style="padding: 24px; display: flex; flex-direction: column; gap: 20px;">
    
    <div class="card card-dark">
      <h3 style="font-size: 1.1rem; font-weight: 800; margin-bottom: 16px;">🛡️ Catatan Jejak Audit (Audit Trail)</h3>
      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>Aktor / User</th>
              <th>Aksi Action</th>
              <th>Tipe Entitas</th>
              <th>Detail Perubahan Data</th>
              <th>Waktu Kejadian</th>
            </tr>
          </thead>
          <tbody id="auditTableBody">
            <!-- JS Rendered -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await AuthModule.requireRole(["ADMIN"]);
      await loadAuditLogs();
    });

    async function loadAuditLogs() {
      const sb = getSupabase();
      const tbody = document.getElementById("auditTableBody");

      const { data: logs } = await sb
        .from("audit_logs")
        .select("*, profiles(full_name)")
        .order("created_at", { ascending: false })
        .limit(50);

      if (!logs || logs.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #94a3b8; padding: 24px;">Belum ada log audit tercatat</td></tr>`;
        return;
      }

      tbody.innerHTML = logs.map(l => `
        <tr>
          <td style="font-weight: 700; color: white;">${l.profiles?.full_name || 'System / Service'}</td>
          <td><span class="badge badge-dinein">${l.action}</span></td>
          <td style="font-family: monospace;">${l.entity_type}</td>
          <td style="font-size: 0.8rem; font-family: monospace; color: #cbd5e1;">${JSON.stringify(l.new_data || {})}</td>
          <td style="font-size: 0.8rem; color: #94a3b8;">${Utils.formatDateTime(l.created_at)}</td>
        </tr>
      `).join("");
    }
  </script>
</body>
</html>
