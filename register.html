<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Registrasi Akun - Mie Gacoan</title>
  <link rel="stylesheet" href="css/main.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="user-container" style="padding: 24px; justify-content: center;">
    
    <div style="text-align: center; margin-bottom: 28px;">
      <div class="brand-badge" style="display: inline-block; font-size: 1rem; padding: 6px 16px; margin-bottom: 12px;">MIE GACOAN</div>
      <h2 style="font-size: 1.75rem; font-weight: 800;">Buat Akun Baru</h2>
      <p style="color: var(--text-secondary); font-size: 0.9rem;">Dapatkan kemudahan pesan & promo eksklusif</p>
    </div>

    <form id="registerForm" style="display: flex; flex-direction: column; gap: 14px;">
      <div>
        <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 6px;">Nama Lengkap</label>
        <input type="text" id="regFullName" required placeholder="Contoh: Budi Santoso" class="card" style="width: 100%; padding: 12px 16px;" />
      </div>

      <div>
        <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 6px;">Email</label>
        <input type="email" id="regEmail" required placeholder="nama@email.com" class="card" style="width: 100%; padding: 12px 16px;" />
      </div>

      <div>
        <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 6px;">Nomor Telepon (WhatsApp)</label>
        <input type="tel" id="regPhone" required placeholder="081234567890" class="card" style="width: 100%; padding: 12px 16px;" />
      </div>

      <div>
        <label style="display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 6px;">Password</label>
        <input type="password" id="regPassword" required minlength="6" placeholder="Minimal 6 karakter" class="card" style="width: 100%; padding: 12px 16px;" />
      </div>

      <button type="submit" id="btnRegisterSubmit" class="btn btn-primary" style="margin-top: 8px;">
        Daftar Sekarang
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.9rem; color: var(--text-secondary);">
      Sudah punya akun? <a href="login.html" style="color: var(--primary-pink); font-weight: 700;">Masuk di sini</a>
    </div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btnRegisterSubmit");
      btn.disabled = true;
      btn.innerText = "Mendaftarkan...";

      try {
        const full_name = document.getElementById("regFullName").value;
        const email = document.getElementById("regEmail").value;
        const phone = document.getElementById("regPhone").value;
        const password = document.getElementById("regPassword").value;

        await AuthModule.register({ full_name, email, password, phone });
        
        Utils.showToast("Registrasi berhasil! Silakan login.", "success");
        setTimeout(() => {
          window.location.href = "login.html";
        }, 1200);
      } catch (err) {
        Utils.showToast(err.message || "Gagal registrasi akun.", "error");
        btn.disabled = false;
        btn.innerText = "Daftar Sekarang";
      }
    });
  </script>
</body>
</html>
