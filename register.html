<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrasi Akun - Mie Gacoan</title>
  <link rel="stylesheet" href="css/main.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="dashboard-container" style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); min-height: 100vh; justify-content: center; align-items: center; padding: 24px 16px;">

  <div class="user-container-narrow" style="width: 100%; max-width: 460px; margin: 0 auto;">
    
    <div class="card card-dark" style="padding: 32px 24px; border: 1px solid var(--border-dark); box-shadow: var(--shadow-xl); background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(12px); border-radius: var(--radius-lg);">
      
      <div style="text-align: center; margin-bottom: 24px;">
        <div style="display: inline-flex; align-items: center; justify-content: center; width: 64px; height: 64px; border-radius: 20px; background: linear-gradient(135deg, var(--primary-pink), #c2185b); box-shadow: 0 8px 24px rgba(233, 30, 99, 0.35); font-size: 1.8rem; margin-bottom: 14px; color: white;">
          <i data-lucide="flame" style="width: 32px; height: 32px;"></i>
        </div>
        <h2 style="font-size: 1.6rem; font-weight: 900; color: white; margin-bottom: 6px;">Buat Akun Baru</h2>
        <p style="color: var(--text-dark-subtle); font-size: 0.88rem;">Dapatkan kemudahan pesan & promo eksklusif Mie Gacoan</p>
      </div>

      <form id="registerForm" style="display: flex; flex-direction: column; gap: 16px;">
        <div class="form-group">
          <label class="form-label">Nama Lengkap</label>
          <input type="text" id="regFullName" required placeholder="Contoh: Budi Santoso" class="form-input" />
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="regEmail" required placeholder="nama@email.com" class="form-input" />
        </div>

        <div class="form-group">
          <label class="form-label">Nomor Telepon (WhatsApp)</label>
          <input type="tel" id="regPhone" required placeholder="081234567890" class="form-input" />
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="regPassword" required minlength="6" placeholder="Minimal 6 karakter" class="form-input" />
        </div>

        <button type="submit" id="btnRegisterSubmit" class="btn btn-primary" style="margin-top: 8px; padding: 14px; font-size: 1rem; display: inline-flex; align-items: center; justify-content: center; gap: 8px;">
          <span>Daftar Sekarang</span> <i data-lucide="arrow-right"></i>
        </button>
      </form>

      <div style="text-align: center; margin-top: 24px; font-size: 0.88rem; color: var(--text-dark-subtle); border-top: 1px solid rgba(255,255,255,0.08); padding-top: 20px;">
        Sudah punya akun? <a href="login.html" style="color: var(--primary-pink); font-weight: 700; text-decoration: none;">Masuk di sini</a>
      </div>

    </div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btnRegisterSubmit");
      btn.disabled = true;
      btn.innerText = "Mendaftarkan...";

      try {
        const full_name = document.getElementById("regFullName").value;
        const email = document.getElementById("regEmail").value;
        const phone = document.getElementById("regPhone").value;
        const password = document.getElementById("regPassword").value;

        await AuthModule.register({ full_name, email, password, phone });
        
        Utils.showToast("Registrasi berhasil! Silakan login.", "success");
        setTimeout(() => {
          window.location.href = "login.html";
        }, 1200);
      } catch (err) {
        Utils.showToast(err.message || "Gagal registrasi akun.", "error");
        btn.disabled = false;
        btn.innerHTML = '<span>Daftar Sekarang</span> <i data-lucide="arrow-right"></i>';
        if (window.lucide) lucide.createIcons();
      }
    });
  </script>
</body>
</html>
