<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Profil Saya - Mie Gacoan</title>
  <link rel="stylesheet" href="../css/main.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="user-container">
    
    <!-- Desktop Header Navigation -->
    <header class="desktop-nav-header">
      <div class="desktop-nav-container">
        <a href="home.html" class="desktop-logo">
          <span class="logo-badge">GACOAN</span>
          <span class="logo-text">Mie Gacoan</span>
        </a>
        <nav class="desktop-nav-links">
          <a href="home.html" class="desktop-nav-link">Beranda</a>
          <a href="menu.html" class="desktop-nav-link">Menu</a>
          <a href="orders.html" class="desktop-nav-link">Pesanan</a>
          <a href="profile.html" class="desktop-nav-link active">Profil</a>
        </nav>
        <div class="desktop-header-actions">
          <a href="cart.html" class="cart-icon-btn">
            🛒 <span class="cart-badge-count cart-count-badge">0</span>
          </a>
        </div>
      </div>
    </header>

    <!-- Mobile Header Navigation -->
    <header class="app-header hide-on-desktop">
      <h1 class="header-title">Profil Saya</h1>
      <a href="home.html" class="icon-btn">🏠</a>
    </header>

    <main style="padding: 16px; display: flex; flex-direction: column; gap: 16px; padding-bottom: 90px;">
      
      <!-- Profile Info Header Card -->
      <div class="card" style="display: flex; align-items: center; gap: 16px; padding: 24px; background: linear-gradient(135deg, #ffffff, #f8fafc); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">
        <div style="width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-pink), #ff4081); color: white; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; font-weight: 900; box-shadow: 0 4px 12px rgba(233, 30, 99, 0.3);">
          👤
        </div>
        <div>
          <h3 id="profName" style="font-size: 1.15rem; font-weight: 800; color: var(--text-primary); margin: 0;">Tamu / Guest</h3>
          <p id="profEmail" style="font-size: 0.85rem; color: var(--text-secondary); margin: 3px 0 0 0;">Belum login</p>
          <span id="profRoleBadge" class="badge badge-dinein" style="font-size: 0.7rem; margin-top: 6px; display: inline-block;">USER</span>
        </div>
      </div>

      <!-- Quick Action Navigation Menu -->
      <div class="card" style="display: flex; flex-direction: column; padding: 8px 18px; border-radius: var(--radius-md);">
        <a href="orders.html" style="display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border-color); font-weight: 600; font-size: 0.925rem; color: var(--text-primary); text-decoration: none;">
          <span style="display: flex; align-items: center; gap: 10px;"><span>📜</span> Riwayat Pesanan Makanan</span>
          <span style="color: var(--text-muted);">→</span>
        </a>
        <a href="reservation.html" style="display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border-color); font-weight: 600; font-size: 0.925rem; color: var(--text-primary); text-decoration: none;">
          <span style="display: flex; align-items: center; gap: 10px;"><span>📅</span> Reservasi Meja Restoran</span>
          <span style="color: var(--text-muted);">→</span>
        </a>
        <a href="../login.html" id="authLink" style="display: flex; justify-content: space-between; align-items: center; padding: 14px 0; font-weight: 600; font-size: 0.925rem; color: var(--primary-pink); text-decoration: none;">
          <span style="display: flex; align-items: center; gap: 10px;"><span>🔑</span> Login / Switch Akun</span>
          <span>→</span>
        </a>
      </div>

      <!-- Active Reservations Section -->
      <div class="card" style="padding: 20px; border-radius: var(--radius-md);">
        <h4 style="font-size: 0.95rem; font-weight: 700; margin-bottom: 12px; color: var(--text-primary); display: flex; align-items: center; gap: 8px;">
          <span>📌</span> Reservasi Meja Aktif
        </h4>
        <div id="userReservationsList" style="display: flex; flex-direction: column; gap: 10px;">
          <!-- JS Rendered Reservations -->
        </div>
      </div>

      <!-- Logout Button (Shown when logged in) -->
      <div id="logoutSection" style="display: none;">
        <button onclick="AuthModule.logout()" class="btn btn-secondary" style="color: var(--accent-red); background: #fee2e2; width: 100%; font-weight: 700; border-radius: var(--radius-md); padding: 12px;">
          🚪 Keluar Akun (Logout)
        </button>
      </div>

    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <a href="home.html" class="nav-item">
        <span class="icon">🏠</span>Beranda
      </a>
      <a href="menu.html" class="nav-item">
        <span class="icon">🍜</span>Menu
      </a>
      <a href="orders.html" class="nav-item">
        <span class="icon">📜</span>Pesanan
      </a>
      <a href="profile.html" class="nav-item active">
        <span class="icon">👤</span>Profil
      </a>
    </nav>

  </div>

  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await loadProfile();
      await loadReservations();
    });

    async function loadProfile() {
      const profile = await getCurrentUserProfile();
      if (profile) {
        document.getElementById("profName").innerText = profile.full_name || "User";
        document.getElementById("profEmail").innerText = profile.email || profile.phone || "";
        document.getElementById("profRoleBadge").innerText = profile.role;
        document.getElementById("logoutSection").style.display = "block";
      }
    }

    async function loadReservations() {
      const sb = getSupabase();
      const user = await getCurrentUserProfile();
      const container = document.getElementById("userReservationsList");

      let query = sb.from("reservations").select("*, tables(table_number)").order("reservation_date", { ascending: false });
      if (user) {
        query = query.eq("user_id", user.id);
      } else {
        query = query.limit(5);
      }

      const { data: list } = await query;

      if (!list || list.length === 0) {
        container.innerHTML = `<div style="font-size: 0.85rem; color: var(--text-muted); text-align: center; padding: 12px;">Belum ada reservasi meja</div>`;
        return;
      }

      container.innerHTML = list.map(r => `
        <a href="reservation-detail.html?id=${r.id}" style="display: flex; justify-content: space-between; align-items: center; background: #f8fafc; padding: 10px 12px; border-radius: var(--radius-sm); font-size: 0.85rem;">
          <div>
            <strong>${r.tables?.table_number || 'Meja Restoran'}</strong>
            <div style="font-size: 0.75rem; color: var(--text-secondary);">${r.reservation_date} • ${r.reservation_time}</div>
          </div>
          <span class="badge ${r.status === 'CONFIRMED' ? 'badge-paid' : 'badge-pending'}">${r.status}</span>
        </a>
      `).join("");
    }
  </script>
</body>
</html>
