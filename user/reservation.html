<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Reservasi Meja Restoran - Mie Gacoan</title>
  <link rel="stylesheet" href="../css/main.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="user-container">
    
    <!-- Desktop Header Navigation -->
    <header class="desktop-nav-header">
      <div class="desktop-nav-container">
        <a href="home.html" class="desktop-logo">
          <span class="logo-badge">GACOAN</span>
          <span class="logo-text">Mie Gacoan</span>
        </a>
        <nav class="desktop-nav-links">
          <a href="home.html" class="desktop-nav-link">Beranda</a>
          <a href="menu.html" class="desktop-nav-link">Menu</a>
          <a href="orders.html" class="desktop-nav-link">Pesanan</a>
          <a href="profile.html" class="desktop-nav-link active">Profil</a>
        </nav>
        <div class="desktop-header-actions">
          <a href="cart.html" class="cart-icon-btn">
            🛒 <span class="cart-badge-count cart-count-badge">0</span>
          </a>
        </div>
      </div>
    </header>

    <!-- Mobile Header Navigation -->
    <header class="app-header hide-on-desktop">
      <div style="display: flex; align-items: center; gap: 10px;">
        <a href="home.html" class="icon-btn">←</a>
        <h1 class="header-title">Reservasi Meja Restoran</h1>
      </div>
    </header>

    <main style="padding: 16px; display: flex; flex-direction: column; gap: 16px; padding-bottom: 40px; max-width: 640px; margin: 0 auto; width: 100%;">
      
      <!-- Intro Card -->
      <div class="card" style="background: linear-gradient(135deg, #1e293b, #0f172a); color: white; border: none; border-radius: var(--radius-lg); padding: 24px; box-shadow: var(--shadow-md);">
        <h3 style="font-size: 1.2rem; font-weight: 800; margin-bottom: 6px; font-family: var(--font-heading);">📅 Booking Tempat Duduk</h3>
        <p style="font-size: 0.85rem; color: #94a3b8; line-height: 1.5;">Pesan tempat untuk acara keluarga, ulang tahun, atau rombongan tanpa perlu antre di lokasi.</p>
      </div>

      <!-- Reservation Form -->
      <form id="reservationForm" class="card" style="display: flex; flex-direction: column; gap: 16px; padding: 24px; border-radius: var(--radius-lg);">
        
        <div class="form-group" style="margin: 0;">
          <label style="display: block; font-size: 0.825rem; font-weight: 700; margin-bottom: 6px; color: var(--text-primary);">Pilih Meja Restoran *</label>
          <select id="resTable" required class="form-input" style="width: 100%;">
            <option value="">-- Pilih Meja (Kapasitas Kursi) --</option>
          </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
          <div class="form-group" style="margin: 0;">
            <label style="display: block; font-size: 0.825rem; font-weight: 700; margin-bottom: 6px; color: var(--text-primary);">Tanggal Reservasi *</label>
            <input type="date" id="resDate" required class="form-input" style="width: 100%;" />
          </div>
          <div class="form-group" style="margin: 0;">
            <label style="display: block; font-size: 0.825rem; font-weight: 700; margin-bottom: 6px; color: var(--text-primary);">Jam Kedatangan *</label>
            <input type="time" id="resTime" required class="form-input" style="width: 100%;" />
          </div>
        </div>

        <div class="form-group" style="margin: 0;">
          <label style="display: block; font-size: 0.825rem; font-weight: 700; margin-bottom: 6px; color: var(--text-primary);">Jumlah Tamu / Orang *</label>
          <input type="number" id="resGuestCount" min="1" max="20" required value="2" class="form-input" style="width: 100%;" />
        </div>

        <div class="form-group" style="margin: 0;">
          <label style="display: block; font-size: 0.825rem; font-weight: 700; margin-bottom: 6px; color: var(--text-primary);">Nama Pemesan *</label>
          <input type="text" id="resCustName" required placeholder="Nama Lengkap" class="form-input" style="width: 100%;" />
        </div>

        <div class="form-group" style="margin: 0;">
          <label style="display: block; font-size: 0.825rem; font-weight: 700; margin-bottom: 6px; color: var(--text-primary);">Nomor Telepon (WhatsApp) *</label>
          <input type="tel" id="resCustPhone" required placeholder="081234567890" class="form-input" style="width: 100%;" />
        </div>

        <div class="form-group" style="margin: 0;">
          <label style="display: block; font-size: 0.825rem; font-weight: 700; margin-bottom: 6px; color: var(--text-primary);">Catatan Tambahan (Opsional)</label>
          <input type="text" id="resNotes" placeholder="Cth: Dekorasi ulang tahun, butuh baby chair..." class="form-input" style="width: 100%;" />
        </div>

        <button type="submit" id="btnResSubmit" class="btn btn-primary" style="margin-top: 8px; width: 100%; padding: 14px;">
          📅 Konfirmasi Reservasi
        </button>

      </form>

    </main>

  </div>

  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    let currentUser = null;

    document.addEventListener("DOMContentLoaded", async () => {
      // Set min date to today
      const today = new Date().toISOString().split("T")[0];
      document.getElementById("resDate").min = today;
      document.getElementById("resDate").value = today;

      await loadTables();
      await autofillUser();
    });

    async function loadTables() {
      const sb = getSupabase();
      const select = document.getElementById("resTable");
      const { data: tables } = await sb.from("tables").select("*").eq("branch_id", window.APP_CONFIG.DEFAULT_BRANCH_ID).order("table_number");

      if (tables) {
        select.innerHTML = '<option value="">-- Pilih Meja (Kapasitas Kursi) --</option>' + tables.map(t => `
          <option value="${t.id}">${t.table_number} (${t.capacity} Kursi)</option>
        `).join("");
      }
    }

    async function autofillUser() {
      currentUser = await getCurrentUserProfile();
      if (currentUser) {
        document.getElementById("resCustName").value = currentUser.full_name || '';
        document.getElementById("resCustPhone").value = currentUser.phone || '';
      }
    }

    document.getElementById("reservationForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btnResSubmit");
      btn.disabled = true;
      btn.innerText = "Memproses Reservasi...";

      try {
        const table_id = document.getElementById("resTable").value;
        const reservation_date = document.getElementById("resDate").value;
        const reservation_time = document.getElementById("resTime").value;
        const guest_count = parseInt(document.getElementById("resGuestCount").value);
        const customer_name = document.getElementById("resCustName").value.trim();
        const customer_phone = document.getElementById("resCustPhone").value.trim();
        const notes = document.getElementById("resNotes").value.trim();

        const sb = getSupabase();

        // Get actual Supabase Auth User ID if logged in, or null if guest/anon
        const { data: authData } = await sb.auth.getUser();
        const validAuthUserId = authData?.user?.id || null;

        const resId = crypto.randomUUID();

        // Create Reservation Record
        const { error } = await sb
          .from("reservations")
          .insert({
            id: resId,
            user_id: validAuthUserId,
            branch_id: window.APP_CONFIG.DEFAULT_BRANCH_ID,
            table_id,
            reservation_date,
            reservation_time,
            guest_count,
            customer_name,
            customer_phone,
            notes: notes || null,
            status: "PENDING"
          });

        if (error) throw error;

        Utils.showToast("Reservasi Berhasil Dibuat!", "success");
        setTimeout(() => {
          window.location.href = `reservation-detail.html?id=${resId}`;
        }, 800);

      } catch (err) {
        Utils.showToast(err.message || "Gagal membuat reservasi. Meja mungkin sudah dibooking pada jam tersebut.", "error");
        btn.disabled = false;
        btn.innerText = "📅 Konfirmasi Reservasi";
      }
    });
  </script>
</body>
</html>
