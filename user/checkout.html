<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout Pesanan - Mie Gacoan</title>
  <link rel="stylesheet" href="../css/main.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="user-container user-container-narrow">
    
    <!-- Header Navigation -->
    <header class="app-header">
      <div style="display: flex; align-items: center; gap: 12px;">
        <a href="cart.html" class="icon-btn"><i data-lucide="arrow-left"></i></a>
        <h1 class="header-title">Konfirmasi Checkout</h1>
      </div>

      <!-- Desktop Navigation Links -->
      <nav class="desktop-nav-links">
        <a href="home.html" class="desktop-nav-link">Beranda</a>
        <a href="menu.html" class="desktop-nav-link">Menu Catalog</a>
        <a href="orders.html" class="desktop-nav-link">Riwayat Pesanan</a>
        <a href="profile.html" class="desktop-nav-link">Profil Saya</a>
      </nav>
    </header>

    <main style="padding: 20px 16px; display: flex; flex-direction: column; gap: 20px; padding-bottom: 110px; flex: 1;">
      
      <!-- Customer Information Form -->
      <div class="card" style="padding: 20px;">
        <h4 style="font-size: 1rem; font-weight: 800; margin-bottom: 16px; color: var(--text-primary);"><i data-lucide="user"></i> Informasi Pemesan</h4>
        
        <div style="display: flex; flex-direction: column; gap: 14px;">
          <div class="form-group">
            <label class="form-label">Nama Pemesan *</label>
            <input type="text" id="custName" required placeholder="Contoh: Budi Santoso" class="form-input" />
          </div>

          <div class="form-group">
            <label class="form-label">Nomor Telepon (WhatsApp) *</label>
            <input type="tel" id="custPhone" required placeholder="081234567890" class="form-input" />
          </div>

          <div class="form-group">
            <label class="form-label">Email (Struk Elektronik)</label>
            <input type="email" id="custEmail" placeholder="nama@email.com" class="form-input" />
          </div>
        </div>
      </div>

      <!-- Dine In / Take Away Summary Card -->
      <div class="card" style="padding: 18px 20px;">
        <h4 style="font-size: 0.95rem; font-weight: 800; margin-bottom: 12px; color: var(--text-primary);"><i data-lucide="map-pin"></i> Tipe & Lokasi Pesanan</h4>
        <div id="checkoutOrderTypeInfo" style="font-size: 0.88rem; color: var(--text-secondary);">
          <!-- Rendered via JS -->
        </div>
      </div>

      <!-- Items List Summary Card -->
      <div class="card" style="padding: 20px;">
        <h4 style="font-size: 0.95rem; font-weight: 800; margin-bottom: 14px; color: var(--text-primary);"><i data-lucide="utensils"></i> Pesanan Saya</h4>
        <div id="checkoutItemsList" style="display: flex; flex-direction: column; gap: 10px;">
          <!-- Rendered via JS -->
        </div>
      </div>

      <!-- Grand Total Summary Card -->
      <div class="card" style="background: linear-gradient(135deg, #1e293b, #0f172a); color: white; border: none; padding: 20px;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
          <div>
            <span style="font-size: 0.82rem; color: #94a3b8; display: block;">Total Tagihan Akhir</span>
            <strong id="checkoutGrandTotal" style="font-size: 1.3rem; color: var(--primary-pink); font-weight: 900;">Rp 0</strong>
          </div>
          <span style="font-size: 0.78rem; background: rgba(255,255,255,0.12); padding: 4px 10px; border-radius: 4px; color: #cbd5e1;">Sudah Termasuk Pajak & Service</span>
        </div>
      </div>

    </main>

    <!-- Bottom Submit Button -->
    <div style="position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: var(--container-content-max); background: white; border-top: 1px solid var(--border-light); padding: 14px 20px; z-index: 80; box-shadow: 0 -4px 20px rgba(15,23,42,0.06);">
      <button onclick="processCheckout()" id="btnProcessCheckout" class="btn btn-primary" style="padding: 14px; font-size: 1.05rem; width: 100%;">
        <i data-lucide="credit-card"></i> Lanjut ke Pembayaran Midtrans <i data-lucide="arrow-right"></i>
      </button>
    </div>

  </div>

  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/cart.js"></script>
  <script>
    let currentUserProfile = null;

    document.addEventListener("DOMContentLoaded", async () => {
      const cart = CartStore.getCart();
      if (cart.items.length === 0) {
        window.location.href = "cart.html";
        return;
      }

      await autofillUser();
      renderCheckoutSummary();
    });

    async function autofillUser() {
      currentUserProfile = await getCurrentUserProfile();
      if (currentUserProfile) {
        document.getElementById("custName").value = currentUserProfile.full_name || '';
        document.getElementById("custPhone").value = currentUserProfile.phone || '';
        document.getElementById("custEmail").value = currentUserProfile.email || '';
      }
    }

    function renderCheckoutSummary() {
      const cart = CartStore.getCart();
      const totals = CartStore.getTotals();

      const typeInfo = document.getElementById("checkoutOrderTypeInfo");
      if (cart.order_type === "DINE_IN") {
        typeInfo.innerHTML = `
          <div style="display: flex; align-items: center; justify-content: space-between;">
            <div>
              <span class="badge badge-dinein">DINE IN</span>
              <strong style="margin-left: 8px; font-size: 0.95rem; color: var(--text-primary);">${cart.table_number || 'Belum Pilih Meja'}</strong>
            </div>
            <a href="home.html" style="font-size: 0.82rem; color: var(--primary-pink); font-weight: 700; text-decoration: none;">Ubah Meja</a>
          </div>
        `;
      } else {
        typeInfo.innerHTML = `
          <div>
            <span class="badge badge-takeaway">TAKE AWAY</span>
            <span style="font-size: 0.85rem; color: var(--text-secondary); margin-left: 8px;">Pesanan Dibungkus</span>
          </div>
        `;
      }

      const itemsList = document.getElementById("checkoutItemsList");
      itemsList.innerHTML = cart.items.map(item => `
        <div style="display: flex; justify-content: space-between; font-size: 0.88rem; border-bottom: 1px solid var(--border-light); padding-bottom: 8px;">
          <div>
            <strong style="color: var(--text-primary);">${item.quantity}x</strong> ${item.product_name}
            ${item.notes ? `<div style="font-size: 0.78rem; color: var(--text-secondary); font-style: italic; margin-top: 2px;">Note: ${item.notes}</div>` : ''}
          </div>
          <span style="font-weight: 800; color: var(--text-primary);">${Utils.formatRupiah(item.subtotal)}</span>
        </div>
      `).join("");

      document.getElementById("checkoutGrandTotal").innerText = Utils.formatRupiah(totals.grandTotal);
    }

    async function processCheckout() {
      const name = document.getElementById("custName").value.trim();
      const phone = document.getElementById("custPhone").value.trim();
      const email = document.getElementById("custEmail").value.trim();

      if (!name || !phone) {
        Utils.showToast("Silakan lengkapi nama dan nomor telepon WhatsApp Anda", "error");
        return;
      }

      const cart = CartStore.getCart();
      if (cart.order_type === "DINE_IN" && !cart.table_id) {
        Utils.showToast("Silakan pilih nomor meja Dine In terlebih dahulu di beranda", "warning");
        setTimeout(() => window.location.href = "home.html", 1200);
        return;
      }

      const btn = document.getElementById("btnProcessCheckout");
      btn.disabled = true;
      btn.innerText = "Membuat Pesanan...";

      try {
        const sb = getSupabase();
        const totals = CartStore.getTotals();
        const orderNumber = `ORD-${new Date().toISOString().slice(0,10).replace(/-/g,'')}-${Math.floor(1000 + Math.random() * 9000)}`;

        // Insert Order to Database
        const { data: order, error: orderErr } = await sb
          .from("orders")
          .insert({
            order_number: orderNumber,
            user_id: currentUserProfile?.id || null,
            branch_id: window.APP_CONFIG.DEFAULT_BRANCH_ID,
            table_id: cart.table_id || null,
            order_type: cart.order_type,
            subtotal: totals.subtotal,
            discount_amount: totals.discount,
            tax_amount: totals.tax,
            service_charge: totals.service,
            grand_total: totals.grandTotal,
            payment_status: "UNPAID",
            order_status: "PENDING_PAYMENT",
            notes: `Pemesan: ${name} (${phone})`
          })
          .select()
          .single();

        if (orderErr) throw orderErr;

        // Insert Order Items
        const orderItemsData = cart.items.map(i => ({
          order_id: order.id,
          product_id: i.product_id,
          product_name: i.product_name,
          price_snapshot: i.price_snapshot,
          quantity: i.quantity,
          subtotal: i.subtotal,
          notes: i.notes || null
        }));

        const { error: itemsErr } = await sb.from("order_items").insert(orderItemsData);
        if (itemsErr) throw itemsErr;

        // Auto sync kitchen ticket for new order
        await Utils.syncKitchenTicket(order.id);

        // Save Customer Info in localStorage for Payment Step
        sessionStorage.setItem("checkout_customer", JSON.stringify({ name, phone, email }));

        // Clear cart
        CartStore.clearCart();

        Utils.showToast("Pesanan Berhasil Dibuat!", "success");
        setTimeout(() => {
          window.location.href = `payment.html?id=${order.id}`;
        }, 600);

      } catch (err) {
        Utils.showToast(err.message || "Gagal membuat pesanan", "error");
        btn.disabled = false;
        btn.innerHTML = '<span>Lanjut ke Pembayaran Midtrans</span> <i data-lucide="arrow-right"></i>';
        if (window.lucide) lucide.createIcons();
      }
    }
  </script>
</body>
</html>
