<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Detail Reservasi - Mie Gacoan</title>
  <link rel="stylesheet" href="../css/main.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="user-container">
    
    <!-- Desktop Header Navigation -->
    <header class="desktop-nav-header">
      <div class="desktop-nav-container">
        <a href="home.html" class="desktop-logo">
          <span class="logo-badge">GACOAN</span>
          <span class="logo-text">Mie Gacoan</span>
        </a>
        <nav class="desktop-nav-links">
          <a href="home.html" class="desktop-nav-link">Beranda</a>
          <a href="menu.html" class="desktop-nav-link">Menu</a>
          <a href="orders.html" class="desktop-nav-link">Pesanan</a>
          <a href="profile.html" class="desktop-nav-link active">Profil</a>
        </nav>
        <div class="desktop-header-actions">
          <a href="cart.html" class="cart-icon-btn">
            🛒 <span class="cart-badge-count cart-count-badge">0</span>
          </a>
        </div>
      </div>
    </header>

    <!-- Mobile Header Navigation -->
    <header class="app-header hide-on-desktop">
      <div style="display: flex; align-items: center; gap: 10px;">
        <a href="profile.html" class="icon-btn">←</a>
        <h1 class="header-title">Detail Reservasi Meja</h1>
      </div>
    </header>

    <main style="padding: 16px; display: flex; flex-direction: column; gap: 16px; max-width: 600px; margin: 0 auto; width: 100%;">
      
      <!-- Status Card -->
      <div class="card" style="text-align: center; padding: 24px; border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);">
        <div id="resStatusBadge" class="badge badge-pending" style="margin-bottom: 12px; font-size: 0.85rem; padding: 6px 16px; display: inline-block;">
          PENDING
        </div>
        <h3 id="resTableTitle" style="font-size: 1.35rem; font-weight: 800; color: var(--text-primary); font-family: var(--font-heading); margin: 0;">-</h3>
        <p id="resDateTime" style="font-size: 0.95rem; color: var(--primary-pink); font-weight: 700; margin-top: 6px;"></p>
      </div>

      <!-- Information Details -->
      <div class="card" style="display: flex; flex-direction: column; gap: 12px; font-size: 0.9rem; padding: 20px; border-radius: var(--radius-lg);">
        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">
          <span style="color: var(--text-secondary);">Nama Pemesan</span>
          <strong id="resName" style="color: var(--text-primary);">-</strong>
        </div>
        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">
          <span style="color: var(--text-secondary);">WhatsApp</span>
          <strong id="resPhone" style="color: var(--text-primary);">-</strong>
        </div>
        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;">
          <span style="color: var(--text-secondary);">Jumlah Tamu</span>
          <strong id="resGuest" style="color: var(--text-primary);">-</strong>
        </div>
        <div style="display: flex; justify-content: space-between;">
          <span style="color: var(--text-secondary);">Catatan</span>
          <span id="resNotes" style="font-style: italic; color: var(--text-primary);">-</span>
        </div>
      </div>

      <!-- Action Button -->
      <div id="cancelActionArea">
        <button onclick="cancelReservation()" id="btnCancelRes" class="btn btn-secondary" style="color: var(--accent-red); background: #fee2e2; width: 100%; font-weight: 700; padding: 12px;">
          ❌ Batalkan Reservasi
        </button>
      </div>

    </main>

  </div>

  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    let resId = null;

    document.addEventListener("DOMContentLoaded", async () => {
      const urlParams = new URLSearchParams(window.location.search);
      resId = urlParams.get("id");

      if (!resId) {
        window.location.href = "profile.html";
        return;
      }

      await loadReservationDetail();
    });

    async function loadReservationDetail() {
      const sb = getSupabase();
      const { data: res, error } = await sb
        .from("reservations")
        .select("*, tables(table_number)")
        .eq("id", resId)
        .single();

      if (error || !res) {
        Utils.showToast("Data reservasi tidak ditemukan", "error");
        setTimeout(() => window.location.href = "profile.html", 1500);
        return;
      }

      const badge = document.getElementById("resStatusBadge");
      badge.innerText = res.status;
      if (res.status === "CONFIRMED") badge.className = "badge badge-paid";
      if (res.status === "CANCELLED") badge.className = "badge badge-cancelled";

      document.getElementById("resTableTitle").innerText = res.tables?.table_number || "Meja Restoran";
      document.getElementById("resDateTime").innerText = `📅 ${res.reservation_date} • 🕒 ${res.reservation_time}`;
      document.getElementById("resName").innerText = res.customer_name;
      document.getElementById("resPhone").innerText = res.customer_phone;
      document.getElementById("resGuest").innerText = `${res.guest_count} Orang`;
      document.getElementById("resNotes").innerText = res.notes || "-";

      if (res.status === "CANCELLED" || res.status === "COMPLETED") {
        document.getElementById("cancelActionArea").style.display = "none";
      }
    }

    async function cancelReservation() {
      if (!confirm("Apakah Anda yakin ingin membatalkan reservasi meja ini?")) return;

      const sb = getSupabase();
      await sb.from("reservations").update({ status: "CANCELLED" }).eq("id", resId);
      Utils.showToast("Reservasi Berhasil Dibatalkan", "success");
      loadReservationDetail();
    }
  </script>
</body>
</html>
