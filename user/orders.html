<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riwayat Pesanan - Mie Gacoan</title>
  <link rel="stylesheet" href="../css/main.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="user-container">
    
    <!-- Header Navigation -->
    <header class="app-header">
      <div style="display: flex; align-items: center; gap: 12px;">
        <a href="home.html" class="icon-btn"><i data-lucide="arrow-left"></i></a>
        <h1 class="header-title">Riwayat Pesanan Saya</h1>
      </div>

      <!-- Desktop Navigation Links -->
      <nav class="desktop-nav-links">
        <a href="home.html" class="desktop-nav-link">Beranda</a>
        <a href="menu.html" class="desktop-nav-link">Menu Catalog</a>
        <a href="orders.html" class="desktop-nav-link active">Riwayat Pesanan</a>
        <a href="reservation.html" class="desktop-nav-link">Reservasi Meja</a>
        <a href="profile.html" class="desktop-nav-link">Profil Saya</a>
      </nav>
    </header>

    <main style="padding: 20px 16px; display: flex; flex-direction: column; gap: 16px; padding-bottom: 100px; flex: 1;">
      <div id="ordersContainer" style="display: flex; flex-direction: column; gap: 14px;">
        <!-- JS Rendered Orders -->
      </div>
    </main>

    <!-- Bottom Navigation Bar (Mobile View) -->
    <nav class="bottom-nav">
      <a href="home.html" class="nav-item">
        <span class="icon"><i data-lucide="home"></i></span>Beranda
      </a>
      <a href="menu.html" class="nav-item">
        <span class="icon"><i data-lucide="utensils"></i></span>Menu
      </a>
      <a href="orders.html" class="nav-item active">
        <span class="icon"><i data-lucide="receipt"></i></span>Pesanan
      </a>
      <a href="profile.html" class="nav-item">
        <span class="icon"><i data-lucide="user"></i></span>Profil
      </a>
    </nav>

  </div>

  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/utils.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await loadUserOrders();
    });

    async function loadUserOrders() {
      const sb = getSupabase();
      const user = await getCurrentUserProfile();
      const container = document.getElementById("ordersContainer");

      let query = sb.from("orders").select("*, tables(table_number)").order("created_at", { ascending: false });
      if (user) {
        query = query.eq("user_id", user.id);
      } else {
        // Show recent active branch orders if guest
        query = query.eq("branch_id", window.APP_CONFIG.DEFAULT_BRANCH_ID).limit(10);
      }

      const { data: orders, error } = await query;

      if (error || !orders || orders.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 48px 16px; color: var(--text-muted);">
            <span style="font-size: 3.5rem; display: block; margin-bottom: 12px;"><i data-lucide="receipt"></i></span>
            <strong style="font-size: 1.1rem; color: var(--text-primary); display: block;">Belum Ada Pesanan</strong>
            <p style="font-size: 0.85rem; margin-top: 4px;">Pesanan yang Anda buat akan muncul di sini.</p>
            <a href="menu.html" class="btn btn-primary" style="width: auto; margin: 18px auto 0 auto; padding: 12px 24px;">Pesan Sekarang <i data-lucide="arrow-right"></i></a>
          </div>
        `;
        return;
      }

      container.innerHTML = orders.map(o => {
        const badgeInfo = Utils.getOrderStatusBadge(o.order_status);
        return `
          <a href="order-detail.html?id=${o.id}" class="card" style="display: block; text-decoration: none; padding: 18px;">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px;">
              <div>
                <span style="font-family: monospace; font-size: 0.85rem; color: var(--text-muted); font-weight: 700;">#${o.order_number}</span>
                <div style="display: flex; gap: 8px; align-items: center; margin-top: 4px;">
                  ${Utils.getOrderTypeBadge(o.order_type)}
                  ${o.tables?.table_number ? `<span class="badge badge-dinein">${o.tables.table_number}</span>` : ''}
                </div>
              </div>
              <span class="badge ${badgeInfo.class}">${badgeInfo.label}</span>
            </div>

            <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-top: 14px; border-top: 1px dashed var(--border-light); padding-top: 12px;">
              <div>
                <span style="font-size: 0.78rem; color: var(--text-secondary); display: block;">${Utils.formatDateTime(o.created_at)}</span>
                ${o.queue_number ? `<span style="font-weight: 900; font-size: 1.15rem; color: var(--primary-pink);">Antrean: ${o.queue_number}</span>` : ''}
              </div>
              <strong style="font-size: 1.1rem; color: var(--text-primary); font-weight: 900;">${Utils.formatRupiah(o.grand_total)}</strong>
            </div>
          </a>
        `;
      }).join("");
    }
  </script>
</body>
</html>
