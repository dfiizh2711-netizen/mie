<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Daftar Menu - Mie Gacoan</title>
  <link rel="stylesheet" href="../css/main.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="user-container">
    
    <!-- Top Bar Navigation -->
    <header class="app-header">
      <div style="display: flex; align-items: center; gap: 10px;">
        <a href="home.html" class="icon-btn" title="Kembali">←</a>
        <h1 class="header-title">Menu Mie Gacoan</h1>
      </div>
      <a href="cart.html" class="icon-btn" title="Keranjang">🛒</a>
    </header>

    <!-- Search Input Bar -->
    <div style="padding: 12px 16px; background: white; border-bottom: 1px solid var(--border-color);">
      <input type="text" id="searchInput" oninput="onSearchInput(this.value)" placeholder="🔍 Cari menu favoritmu (cth: Hompimpa, Udang Keju)..." class="card" style="width: 100%; padding: 10px 14px; font-size: 0.85rem;" />
    </div>

    <!-- Category Tabs Bar -->
    <div style="display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; background: white; border-bottom: 1px solid var(--border-color); scrollbar-width: none;">
      <button onclick="filterCategory('all')" id="catTab-all" class="btn btn-primary" style="width: auto; padding: 6px 14px; font-size: 0.8rem; border-radius: var(--radius-full);">Semua</button>
      <button onclick="filterCategory('mie')" id="catTab-mie" class="btn btn-secondary" style="width: auto; padding: 6px 14px; font-size: 0.8rem; border-radius: var(--radius-full);">🍜 Mie</button>
      <button onclick="filterCategory('dimsum')" id="catTab-dimsum" class="btn btn-secondary" style="width: auto; padding: 6px 14px; font-size: 0.8rem; border-radius: var(--radius-full);">🥟 Dimsum</button>
      <button onclick="filterCategory('minuman')" id="catTab-minuman" class="btn btn-secondary" style="width: auto; padding: 6px 14px; font-size: 0.8rem; border-radius: var(--radius-full);">🧋 Minuman</button>
      <button onclick="filterCategory('snack')" id="catTab-snack" class="btn btn-secondary" style="width: auto; padding: 6px 14px; font-size: 0.8rem; border-radius: var(--radius-full);">🍟 Snack</button>
      <button onclick="filterCategory('paket')" id="catTab-paket" class="btn btn-secondary" style="width: auto; padding: 6px 14px; font-size: 0.8rem; border-radius: var(--radius-full);">🍱 Paket</button>
    </div>

    <!-- Product Grid Container -->
    <main id="productGrid" style="padding: 16px; display: grid; grid-template-columns: 1fr; gap: 14px; padding-bottom: 100px;">
      <!-- JS Rendered Products -->
    </main>

    <!-- Floating Cart Bar -->
    <div id="floatingCart" class="floating-cart-bar" style="display: none;" onclick="window.location.href='cart.html'">
      <div class="cart-bar-info">
        <span id="cartItemCount" class="cart-bar-badge">0</span>
        <div>
          <span style="font-size: 0.75rem; color: #cbd5e1; display: block;">Total Pesanan</span>
          <span id="cartTotalDisplay" class="cart-bar-total">Rp 0</span>
        </div>
      </div>
      <button class="btn btn-primary" style="width: auto; padding: 8px 16px; font-size: 0.85rem;">Lanjut Bayar →</button>
    </div>

  </div>

  <!-- Product Detail & Level Pedas Modal -->
  <div id="productModal" class="modal-backdrop" onclick="closeProductModal()">
    <div class="modal-sheet" onclick="event.stopPropagation()">
      <div class="modal-drag-handle"></div>
      
      <div style="display: flex; gap: 14px; margin-bottom: 16px;">
        <img id="modalImg" src="" style="width: 80px; height: 80px; object-fit: cover; border-radius: var(--radius-md);" />
        <div>
          <h3 id="modalTitle" style="font-size: 1.1rem; font-weight: 800;"></h3>
          <p id="modalPrice" style="color: var(--primary-pink); font-weight: 800; font-size: 1.05rem; margin-top: 2px;"></p>
          <p id="modalDesc" style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 4px;"></p>
        </div>
      </div>

      <!-- Level Pedas Options (Visible if Mie category) -->
      <div id="levelSection" style="margin-bottom: 16px; display: none;">
        <label style="font-weight: 700; font-size: 0.85rem; display: block; margin-bottom: 8px;">LEVEL PEDAS (Wajib pilih 1):</label>
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;" id="levelButtons">
          <!-- Level 1 - 8 buttons rendered via JS -->
        </div>
      </div>

      <!-- Special Notes Input -->
      <div style="margin-bottom: 20px;">
        <label style="font-weight: 700; font-size: 0.85rem; display: block; margin-bottom: 6px;">Catatan Khusus (Opsional):</label>
        <input type="text" id="modalNotes" placeholder="Cth: Tanpa daun bawang, es dipisah..." class="card" style="width: 100%; padding: 10px 14px; font-size: 0.85rem;" />
      </div>

      <!-- Action Footer with Qty Controller -->
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 14px; border-top: 1px solid var(--border-color); padding-top: 16px;">
        <div class="qty-ctrl">
          <button onclick="changeModalQty(-1)" class="qty-btn">−</button>
          <span id="modalQtyVal" class="qty-val">1</span>
          <button onclick="changeModalQty(1)" class="qty-btn">+</button>
        </div>

        <button onclick="confirmAddCart()" class="btn btn-primary" style="flex: 1;">
          Tambah - <span id="modalBtnTotal">Rp 0</span>
        </button>
      </div>

    </div>
  </div>

  <script src="../js/config.js"></script>
  <script src="../js/supabase-client.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/cart.js"></script>
  <script>
    let allProducts = [];
    let activeCategory = 'all';
    let selectedProduct = null;
    let selectedLevel = 1;
    let currentModalQty = 1;

    document.addEventListener("DOMContentLoaded", async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const catParam = urlParams.get("category");
      if (catParam) activeCategory = catParam;

      await loadProducts();
      updateCartBar();
      window.addEventListener("cartUpdated", updateCartBar);
    });

    async function loadProducts() {
      const sb = getSupabase();
      const { data: products } = await sb
        .from("products")
        .select("*, categories(*)")
        .eq("is_active", true)
        .order("created_at");

      allProducts = products || [];
      renderProducts();
    }

    function renderProducts(query = "") {
      const grid = document.getElementById("productGrid");
      let filtered = allProducts;

      if (activeCategory !== 'all') {
        filtered = filtered.filter(p => p.categories?.slug === activeCategory);
      }

      if (query.trim() !== "") {
        const q = query.toLowerCase();
        filtered = filtered.filter(p => p.name.toLowerCase().includes(q) || p.description?.toLowerCase().includes(q));
      }

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <span style="font-size: 3rem;">🔍</span>
            <div class="empty-state-title">Menu Tidak Ditemukan</div>
            <p>Coba kata kunci lain atau pilih kategori berbeda.</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = filtered.map(p => `
        <div class="card" style="display: flex; gap: 12px; align-items: center; padding: 12px;">
          <img src="${p.image_url || 'https://via.placeholder.com/80'}" style="width: 85px; height: 85px; object-fit: cover; border-radius: var(--radius-md);" />
          <div style="flex: 1;">
            <h4 style="font-size: 0.95rem; font-weight: 800;">${p.name}</h4>
            <p style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 2px; line-clamp: 2; display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden;">${p.description || ''}</p>
            <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px;">
              <span style="font-weight: 800; font-size: 0.95rem; color: var(--primary-pink);">${Utils.formatRupiah(p.base_price)}</span>
              <button onclick="openProductModal('${p.id}')" ${!p.is_available ? 'disabled' : ''} class="btn btn-primary" style="width: auto; padding: 6px 14px; font-size: 0.8rem;">
                ${p.is_available ? '+ Tambah' : 'Habis'}
              </button>
            </div>
          </div>
        </div>
      `).join("");
    }

    function filterCategory(catSlug) {
      activeCategory = catSlug;
      document.querySelectorAll("[id^='catTab-']").forEach(btn => {
        btn.className = "btn btn-secondary";
        btn.style.background = "#e2e8f0";
        btn.style.color = "#334155";
      });
      const activeBtn = document.getElementById(`catTab-${catSlug}`);
      if (activeBtn) {
        activeBtn.className = "btn btn-primary";
        activeBtn.style.background = "var(--primary-pink)";
        activeBtn.style.color = "white";
      }
      renderProducts();
    }

    function onSearchInput(val) {
      renderProducts(val);
    }

    function openProductModal(productId) {
      selectedProduct = allProducts.find(p => p.id === productId);
      if (!selectedProduct) return;

      currentModalQty = 1;
      selectedLevel = 1;

      document.getElementById("modalTitle").innerText = selectedProduct.name;
      document.getElementById("modalPrice").innerText = Utils.formatRupiah(selectedProduct.base_price);
      document.getElementById("modalDesc").innerText = selectedProduct.description || '';
      document.getElementById("modalImg").src = selectedProduct.image_url || 'https://via.placeholder.com/80';
      document.getElementById("modalNotes").value = '';

      const isMie = selectedProduct.categories?.slug === 'mie';
      const levelSection = document.getElementById("levelSection");

      if (isMie) {
        levelSection.style.display = "block";
        renderLevelButtons();
      } else {
        levelSection.style.display = "none";
      }

      updateModalTotal();
      Utils.openModal("productModal");
    }

    function renderLevelButtons() {
      const container = document.getElementById("levelButtons");
      let html = '';
      for (let i = 1; i <= 8; i++) {
        const active = selectedLevel === i;
        html += `
          <button onclick="selectLevel(${i})" class="btn" style="padding: 8px 0; font-size: 0.8rem; background: ${active ? 'var(--primary-pink)' : '#f1f5f9'}; color: ${active ? 'white' : 'var(--text-primary)'}; border: 1px solid ${active ? 'var(--primary-pink)' : '#cbd5e1'};">
            Lvl ${i}
          </button>
        `;
      }
      container.innerHTML = html;
    }

    function selectLevel(lvl) {
      selectedLevel = lvl;
      renderLevelButtons();
    }

    function changeModalQty(delta) {
      currentModalQty = Math.max(1, currentModalQty + delta);
      document.getElementById("modalQtyVal").innerText = currentModalQty;
      updateModalTotal();
    }

    function updateModalTotal() {
      const total = currentModalQty * (selectedProduct ? selectedProduct.base_price : 0);
      document.getElementById("modalBtnTotal").innerText = Utils.formatRupiah(total);
    }

    function confirmAddCart() {
      if (!selectedProduct) return;
      const notes = document.getElementById("modalNotes").value;
      const isMie = selectedProduct.categories?.slug === 'mie';

      CartStore.addItem(selectedProduct, currentModalQty, isMie ? selectedLevel : null, notes);
      closeProductModal();
    }

    function closeProductModal() {
      Utils.closeModal("productModal");
    }

    function updateCartBar() {
      const totals = CartStore.getTotals();
      const bar = document.getElementById("floatingCart");

      if (totals.itemCount > 0) {
        bar.style.display = "flex";
        document.getElementById("cartItemCount").innerText = totals.itemCount;
        document.getElementById("cartTotalDisplay").innerText = Utils.formatRupiah(totals.grandTotal);
      } else {
        bar.style.display = "none";
      }
    }
  </script>
</body>
</html>
