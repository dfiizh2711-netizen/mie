<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mie Gacoan - Self Ordering & POS</title>
  <meta name="description" content="Sistem Pemesanan Online & Kasir Mie Gacoan Sidoarjo Pabean" />
  <link rel="stylesheet" href="css/main.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="user-container" style="background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); color: white; justify-content: center; align-items: center; padding: 24px;">
    
    <div style="text-align: center; margin-bottom: 40px;">
      <div style="display: inline-flex; align-items: center; justify-content: center; width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg, var(--primary-pink), #ff4081); margin-bottom: 20px; box-shadow: 0 10px 30px rgba(233, 30, 99, 0.4);">
        <span style="font-size: 2.2rem; font-weight: 900; color: white;">ME</span>
      </div>
      <h1 style="font-size: 2.2rem; font-weight: 900; letter-spacing: -1px; margin-bottom: 8px;">MIE GACOAN</h1>
      <p style="color: #94a3b8; font-size: 0.95rem;">Sistem Ordering, POS, KDS & Reservasi Restoran</p>
    </div>

    <!-- Quick Navigation Cards -->
    <div style="width: 100%; display: flex; flex-direction: column; gap: 14px;">
      
      <a href="user/home.html" class="btn btn-primary" style="padding: 16px; font-size: 1.05rem;">
        🍜 Pesan Menu Sekarang (Customer)
      </a>

      <a href="login.html" class="btn btn-secondary" style="padding: 14px; font-size: 0.95rem; background: #334155; color: white;">
        🔑 Login Akun / Registrasi
      </a>

      <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid #334155; display: flex; flex-direction: column; gap: 10px;">
        <p style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #64748b; font-weight: 700; text-align: center;">Portal Staff / Karyawan</p>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
          <a href="cashier/dashboard.html" class="btn btn-dark" style="font-size: 0.8rem; padding: 10px 4px; text-align: center;">
            🖥️ Kasir / POS
          </a>
          <a href="kitchen/dashboard.html" class="btn btn-dark" style="font-size: 0.8rem; padding: 10px 4px; text-align: center;">
            🍳 Dapur KDS
          </a>
          <a href="admin/dashboard.html" class="btn btn-dark" style="font-size: 0.8rem; padding: 10px 4px; text-align: center;">
            ⚙️ Admin
          </a>
        </div>
      </div>

    </div>

    <div style="margin-top: 40px; font-size: 0.75rem; color: #64748b; text-align: center;">
      © 2026 Mie Gacoan Sidoarjo Pabean • Production Build
    </div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/utils.js"></script>
</body>
</html>
